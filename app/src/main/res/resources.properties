# Declares the locale of the unqualified `values/` resources so AGP can generate
# `android:localeConfig` (androidResources { generateLocaleConfig = true } in
# app/build.gradle.kts). The English source strings in `values/` are the reviewed
# UI-complete fallback — see REVIEWED_UI_LOCALES in scripts/check-locale-coverage.py.
unqualifiedResLocale=en-US
