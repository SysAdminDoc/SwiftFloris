name: 💥 Crash report
description: Create a report with a generated crash log attached to help SwiftFloris improve
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your help in making SwiftFloris better!
        Guide to a good crash-report:
        • Please search existing bug/crash reports to avoid creating duplicates.
        • Give your crash report a good name (no generics like "Error" or "Crash"), so others can easily identify the topic of your issue.
        • Describe what you were doing what could've led to the crash and whether the crash is random or reproducible.
  - type: textarea
    id: description
    attributes:
      label: Short description
      description: Describe the bug in a short but concise way.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1. Go to '…'
        2. Click on '…'
        3. Scroll down to '…'
        4. See crash
    validations:
      required: true
  - type: input
    id: florisversion
    attributes:
      label: SwiftFloris Version
      placeholder: e.g. 1.9.53 (2102)
    validations:
      required: true
  - type: dropdown
    id: installsource
    attributes:
      label: Install Source
      options:
        - GitHub Releases
        - Obtainium
        - F-Droid
        - Self-built release APK
        - Self-built debug APK
        - Other / unknown
    validations:
      required: true
  - type: input
    id: androidversion
    attributes:
      label: Android Version
      placeholder: e.g. Android 16, stock ROM
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device Model
      placeholder: e.g. Samsung Galaxy S25 Ultra / SM-S938B
    validations:
      required: true
  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Every time
        - Often
        - Intermittent
        - Once
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: crashlogsource
    attributes:
      label: Crash Log Source
      options:
        - In-app crash dialog
        - Android crash prompt
        - adb logcat
        - Other / unknown
    validations:
      required: true
  - type: textarea
    id: crashlog
    attributes:
      label: Crash log
      description: Paste the generated crash log below after redacting private typed content.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I made sure that there are *no existing issues* - [open](https://github.com/SysAdminDoc/SwiftFloris/issues) or [closed](https://github.com/SysAdminDoc/SwiftFloris/issues?q=is%3Aissue+is%3Aclosed) - which I could contribute my information to."
          required: true
        - label: "I have read and understood the [SwiftFloris contribution notes](https://github.com/SysAdminDoc/SwiftFloris#contributing)."
          required: true
        - label: "I have removed typed text, clipboard content, personal dictionary content, private APK paths, and unrelated device logs unless a maintainer explicitly asked for them."
          required: true
        - label: "I have taken the time to fill in all the required details. I understand that the crash report will be dismissed otherwise."
          required: true
