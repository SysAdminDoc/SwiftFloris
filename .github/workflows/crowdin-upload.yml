name: Crowdin Upload Sources

on:
  push:
    branches: [ main ]
    paths:
      - "app/src/main/res/values/strings.xml"
      - ".github/workflows/crowdin-upload.yml"

# Default GITHUB_TOKEN limited to read-only. This workflow uses a separate
# Crowdin personal token (env FSEC_CROWDIN_PERSONAL_TOKEN); restricting the
# default token blocks a malicious / compromised third-party action from
# pushing to the repo via the workflow's own token. The Crowdin token
# remains potent — pin `crowdin/github-action` to a SHA in a follow-up.
permissions:
  contents: read

jobs:
  upload-to-crowdin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Upload
        # SHA pin: crowdin/github-action@v2 = 8868a33591d21088edfc398968173a3b98d51706
        # Verified 2026-05-17 via `GET /repos/crowdin/github-action/git/refs/tags/v2`.
        # When the maintainer wants to ride a newer v2 patch, look up the tag's
        # SHA again and substitute. Never re-introduce the floating `@v2` tag —
        # this action receives the Crowdin personal token + GITHUB_TOKEN.
        uses: crowdin/github-action@52aa776766211d83d975df51f3b9c53c2f8ba35f # v2
        with:
          config: "crowdin.yml"
          upload_sources: true
          upload_translations: false
          download_translations: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FSEC_CROWDIN_PROJECT_ID: ${{ secrets.FSEC_CROWDIN_PROJECT_ID }}
          FSEC_CROWDIN_PERSONAL_TOKEN: ${{ secrets.FSEC_CROWDIN_PERSONAL_TOKEN }}
