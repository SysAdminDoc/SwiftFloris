name: Android Emulator Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
    paths:
      - ".github/workflows/emulator-smoke.yml"
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/kotlin/dev/patrickgold/florisboard/app/**"
      - "app/src/main/kotlin/dev/patrickgold/florisboard/FlorisApplication.kt"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"

permissions:
  contents: read

concurrency:
  group: emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settings-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # v4.3.3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch settings on emulator
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p dev.patrickgold.florisboard.debug -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof dev.patrickgold.florisboard.debug
            adb shell dumpsys activity activities | grep -E "dev\.patrickgold\.florisboard\.debug|FlorisAppActivity|SettingsLauncherAlias"
            adb logcat -d -t 2000 > emulator-smoke-logcat.txt
            if grep -E "FATAL EXCEPTION|AndroidRuntime" emulator-smoke-logcat.txt; then
              echo "::error::Crash detected during settings-launch smoke."
              exit 1
            fi

      - name: Upload emulator smoke logcat
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-smoke-logcat
          path: emulator-smoke-logcat.txt
