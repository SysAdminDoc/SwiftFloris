name: Android Emulator Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
    paths:
      - ".github/workflows/emulator-smoke.yml"
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/androidTest/**"
      - "app/src/main/kotlin/dev/patrickgold/florisboard/app/**"
      - "app/src/main/kotlin/dev/patrickgold/florisboard/ime/**"
      - "app/src/main/kotlin/dev/patrickgold/florisboard/FlorisApplication.kt"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"

permissions:
  contents: read

concurrency:
  group: emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ime-smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone-api35-ime-smoke
            api-level: 35
            wm-size: ""
            wm-density: ""
            universal-resizable: false
          - name: tablet-api36-adaptive-ime-smoke
            api-level: 36
            wm-size: "2560x1600"
            wm-density: "320"
            universal-resizable: true
          - name: foldable-api36-adaptive-ime-smoke
            api-level: 36
            wm-size: "2208x1840"
            wm-density: "320"
            universal-resizable: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@ea004816823209b8d1211e47b216185caee12cc5 # v4.0.2

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run IME smoke on emulator
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APP_ID=io.github.sysadmindoc.swiftfloris.debug
            if [ -n "${{ matrix.wm-size }}" ]; then
              adb shell wm size "${{ matrix.wm-size }}"
              adb shell wm density "${{ matrix.wm-density }}"
            fi
            ./gradlew :app:installDebug
            # Android 17/API 37 removes the large-screen opt-out. API 36 with
            # UNIVERSAL_RESIZABLE_BY_DEFAULT exercises the same adaptive window
            # path while stable API 37 emulator images are not required in CI.
            if [ "${{ matrix.universal-resizable }}" = "true" ]; then
              adb shell am compat enable 357141415 "$APP_ID" || true
            fi
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=dev.patrickgold.florisboard.ime.smoke.ImeEndToEndSmokeTest
            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof "$APP_ID"
            adb shell dumpsys activity activities | grep -E "io\.github\.sysadmindoc\.swiftfloris\.debug|FlorisAppActivity|SettingsLauncherAlias"
            adb shell dumpsys input > emulator-input-devices.txt
            adb shell settings get secure show_ime_with_hard_keyboard > emulator-physical-keyboard-settings.txt
            adb logcat -d -t 2000 > emulator-smoke-logcat.txt
            if grep -E "FATAL EXCEPTION|AndroidRuntime" emulator-smoke-logcat.txt; then
              echo "::error::Crash detected during settings-launch smoke."
              exit 1
            fi

      - name: Upload emulator smoke logcat
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}-emulator-smoke-diagnostics
          path: |
            emulator-smoke-logcat.txt
            emulator-input-devices.txt
            emulator-physical-keyboard-settings.txt
