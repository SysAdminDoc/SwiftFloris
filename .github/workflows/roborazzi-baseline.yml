name: Roborazzi baseline capture

# ROADMAP matrix #6 — operator-triggered Roborazzi baseline capture. The standard
# `verifyRoborazziDebug` job in `android.yml` diffs every captured PNG against the
# baseline under `app/src/test/snapshots/`. New screenshot tests + theme
# bumps + dimension changes all need a fresh baseline before that diff can be a
# real gate. This workflow lets a maintainer run `recordRoborazziDebug` on
# demand without pulling the whole repo onto their laptop:
#
#   - Trigger: `workflow_dispatch` only — never on push / PR. The point is to
#     keep baseline writes maintainer-controlled.
#   - Output: the freshly-captured snapshot tree is uploaded as a workflow
#     artifact (`roborazzi-baselines-<run-id>`). The maintainer downloads it,
#     drops the PNGs into `app/src/test/snapshots/`, and commits.
#
# Historical note: an earlier revision of this comment instructed the maintainer
# to remove a `continue-on-error: true` flag from android.yml once baselines
# landed. v1.8.123 already promoted `:app:verifyRoborazziDebug` to a hard gate,
# so the android.yml step no longer carries `continue-on-error`. The note is
# kept here only as audit-trail.

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Optional context for the artifact name (e.g. 'theme-bump', 'new-settings-screen')."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: 17
          distribution: temurin

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify no-network contract (sanity)
        run: ./gradlew :app:verifyNoInternetPermission

      - name: Record Roborazzi baselines
        run: ./gradlew :app:recordRoborazziDebug

      - name: Summarise captured baseline tree
        if: always()
        env:
          CAPTURE_MESSAGE: ${{ inputs.message }}
        run: |
          baseline_dir="app/src/test/snapshots/images"
          if [ -d "$baseline_dir" ]; then
            count=$(find "$baseline_dir" -type f -name "*.png" | wc -l)
            echo "## Roborazzi baselines captured" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Snapshot count:** $count PNGs" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Directory:** \`$baseline_dir\`" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$CAPTURE_MESSAGE" ]; then
              echo "- **Context:** $CAPTURE_MESSAGE" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the artifact, copy into \`$baseline_dir/\` locally, and commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No baseline directory produced — check whether any Roborazzi tests are wired."
          fi

      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roborazzi-baselines-${{ github.run_id }}${{ inputs.message && format('-{0}', inputs.message) || '' }}
          path: app/src/test/snapshots/images/
          if-no-files-found: warn
